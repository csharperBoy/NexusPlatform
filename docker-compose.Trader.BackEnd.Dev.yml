services:
  aksteel-sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: sqlserver
    user: root
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Fajr@123
    ports:
      - "1434:1433"
    volumes:
      - mssql_2025_dev_data:/var/opt/mssql/data
      - ./sqlserver-data:/var/opt/mssql/import
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Fajr@123 -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - dev-network

  aksteel-redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379" # باز برای اتصال ابزارهای GUI مدیریت ردیس در توسعه
    networks:
      - dev-network

  aksteel-webapi:
    image: m2931374/aksteel-webapi:latest
    container_name: trader_webapi_dev
    build:
      context: .
      dockerfile: Trader.WebApi/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=TraderDb;User Id=sa;Password=Fajr@123;TrustServerCertificate=True;MultipleActiveResultSets=true
      - ConnectionStrings__Redis=redis:6379,abortConnect=false
    ports:
      - "8080:8080"
    depends_on:
      aksteel-sqlserver:
        condition: service_healthy
      aksteel-redis:
        condition: service_started
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge

volumes:
  mssql_2025_dev_data:



# ۱. لاگین به داکر هاب
# docker login
# cd D:\Project\NexusPlatform
# ۲. ساخت ایمیج
# docker compose -f docker-compose.Trader.BackEnd.Dev.yml build trader-webapi

# ۳. ارسال به داکر هاب
# docker push m2931374/trader-webapi:latest