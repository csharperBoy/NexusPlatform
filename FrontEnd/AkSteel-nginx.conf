server {
    listen 80;
    server_name localhost;

    # ۱. مدیریت درخواست‌های UI و React Router (SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # ۲. پروکسی تمام درخواست‌های API به Gateway
    location /api/ {
        # استفاده از نام کانتینر گیت‌وی در شبکه داکر
        # اسلش انتهای آدرس (/) باعث می‌شود پیشوند /api هنگام ارسال به Gateway حذف شود
        proxy_pass http://aksteel-webapi:8080/;
        
        # پاس دادن هدرهای واقعی کاربر به گیت‌وی
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # تنظیمات Timeouts برای APIهای سنگین
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ۳. بهینه‌سازی کش فایل‌های استاتیک
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ۴. فشرده‌سازی Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}