version: "3.8"

services:
  aksteel-admin:
    build:
      context: .
      dockerfile: Dockerfile.aksteel-admin
    ports:
      - "3000:80"
    container_name: aksteel-admin
    depends_on:
      - aksteel-gateway
    networks:
      - aksteel-network

  aksteel-website-phonebook:
    build:
      context: .
      dockerfile: Dockerfile.aksteel-website-phonebook
    ports:
      - "3001:80"
    container_name: aksteel-website-phonebook
    depends_on:
      - aksteel-gateway
    networks:
      - aksteel-network

    # for create
    # cd D:\Project\NexusPlatform\FrontEnd
    # docker compose -f AkSteel-docker-compose.yml  up --build
