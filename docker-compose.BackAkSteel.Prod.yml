services:
  aksteel-redis:
    image: redis:alpine
    container_name: aksteel_redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - aksteel-network

  aksteel-webapi:
    image: m2931374/aksteel-webapi:latest
    container_name: aksteel_webapi
    restart: always
    # پورت باز به بیرون ندارد
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=${DB_SERVER_IP},1433;Database=AksteelDb;User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true
      - ConnectionStrings__Redis=aksteel-redis:6379,abortConnect=false
    depends_on:
      aksteel-redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    networks:
      - aksteel-network

  aksteel-nginx:
    image: nginx:alpine
    container_name: aksteel_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.Aksteel.Backend.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - aksteel-webapi
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - aksteel-network

networks:
  aksteel-network:
    driver: bridge
  


